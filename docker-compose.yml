services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobapply
      POSTGRES_PASSWORD: jobapply
      POSTGRES_DB: jobapply
    ports:
      - "5433:5432" # host port 5433: a Windows PostgreSQL service already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
